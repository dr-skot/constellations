<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Finding … — Sky Trainer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/base.css?v=d41a16ea480b">
  <link rel="stylesheet" href="css/explore.css?v=d41a16ea480b">
  <style>
    header {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 300;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #a8bfff;
    }

    header .sub {
      font-size: .8rem;
      color: var(--dim);
    }

    header a {
      margin-left: auto;
      font-size: .8rem;
      color: var(--accent);
      text-decoration: none;
    }

    header a:hover { text-decoration: underline; }

    #picker {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
    }

    #picker p {
      font-size: .9rem;
      color: var(--dim);
    }

    #picker-row {
      display: flex;
      gap: 10px;
    }

    #picker-input {
      flex: 1;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: .9rem;
    }

    #picker-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    #picker-msg {
      font-size: .8rem;
      color: var(--err);
      min-height: 1.2em;
    }
  </style>
</head>

<body>
  <div id="app">

    <header>
      <h1>Sky Trainer</h1>
      <span class="sub" id="page-sub">Finding …</span>
      <a href="find-help.html" id="back-link">← Back</a>
    </header>

    <div id="picker" style="display:none">
      <p>Which constellation would you like to find?</p>
      <div id="picker-row">
        <input type="text" id="picker-input" list="con-search-list" placeholder="Type a constellation name…"
          autocomplete="off">
        <datalist id="con-search-list"></datalist>
        <button class="btn-go" id="picker-go">Go →</button>
      </div>
      <div id="picker-msg"></div>
    </div>

    <div id="screen-explore" class="screen">
      <div class="screen-body">
        <div class="explore-layers" style="display:none">
          <label><input type="checkbox" id="chk-ex-photo"> Photo</label>
          <label><input type="checkbox" id="chk-ex-stars" checked> Stars</label>
          <label><input type="checkbox" id="chk-ex-lines" checked> Lines</label>
          <label><input type="checkbox" id="chk-ex-bounds"> Bounds</label>
          <label><input type="checkbox" id="chk-ex-art"> Art</label>
          <label><input type="checkbox" id="chk-ex-starlabels"> Star names</label>
          <label><input type="checkbox" id="chk-ex-connames" checked> Con. names</label>
          <label><input type="checkbox" id="chk-ex-equator"> Equator</label>
        </div>
        <div id="explore-area">
          <div id="explore-wrap">
            <canvas id="explore-gl-canvas"></canvas>
            <canvas id="explore-canvas"></canvas>
            <canvas id="annotation-canvas"></canvas>
          </div>
        </div>
        <div id="explore-roll-strip" style="padding:4px;text-align:center;font-size:12px;color:#aaa;cursor:ew-resize;user-select:none;letter-spacing:0.05em">Rotate</div>
      </div>
      <div id="find-guide-overlay">
        <div id="fg-info-row">
          <div id="fg-step-row">
            <div id="fg-step-dots"></div>
            <span id="fg-step-count"></span>
          </div>
        </div>
        <div id="fg-caption-label"></div>
        <p id="fg-caption-text"></p>
        <div id="fg-nav-row">
          <button id="fg-btn-prev">← Previous</button>
          <button id="fg-btn-toggle-diag" style="display:none">Show overlays</button>
          <button id="fg-btn-next">Next →</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Version-stamped like index.html, and for a sharper reason than staleness alone:
       these files call across each other, so a visitor holding a cached explore.js and
       a fresh guide-renderer.js gets a page that loads and then throws on the first
       camera flight. The stamp makes the set arrive or not arrive together. Bump it
       with index.html's whenever app JS changes. -->
  <script src="js/cache-stamp.js?v=d41a16ea480b"></script>
  <script src="js/data.js?v=d41a16ea480b"></script>
  <script src="js/lesson.js?v=d41a16ea480b"></script>
  <!-- All four figure sets, as in index.html: the Figures setting applies wherever
       figures are drawn, and this page reads it at boot. -->
  <script src="js/stellarium-data.js?v=d41a16ea480b"></script>
  <script src="js/ford-data.js?v=d41a16ea480b"></script>
  <script src="js/rey-data.js?v=d41a16ea480b"></script>
  <script src="js/diagram-sources.js?v=d41a16ea480b"></script>
  <script src="js/draw-phases.js?v=d41a16ea480b"></script>
  <script src="js/render-scheduler.js?v=d41a16ea480b"></script>
  <script src="js/projection.js?v=d41a16ea480b"></script>
  <script src="js/reveal.js?v=d41a16ea480b"></script>
  <script src="js/render.js?v=d41a16ea480b"></script>
  <script src="js/explore-gl.js?v=d41a16ea480b"></script>
  <script src="js/explore.js?v=d41a16ea480b"></script>
  <script src="js/step-display.js?v=d41a16ea480b"></script>
  <script src="js/guide-renderer.js?v=d41a16ea480b"></script>
  <!-- After step-display.js (the schema gate reads _SD_LAYERS from it) and after
       guide-renderer.js (the roll uses guideNorthUpR). -->
  <script src="js/guide-source.js?v=d41a16ea480b"></script>
  <script>
    // Honour the learner's Figures choice before anything draws. There is no
    // switcher on this page, so this is the only read.
    loadDiagramSource();

    // ── Resolve constellation from URL param ──────────────────────────────────
    const params = new URLSearchParams(location.search);
    const conParam = params.get('con');
    const con = conParam
      ? C.find(c => c.abbr.toLowerCase() === conParam.toLowerCase() ||
        c.name.toLowerCase() === conParam.toLowerCase())
      : null;

    if (!con) {
      document.getElementById('page-sub').textContent = 'Finding …';
      const picker = document.getElementById('picker');
      picker.style.display = '';
      const dl = document.getElementById('con-search-list');
      [...C].sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
        const o = document.createElement('option'); o.value = c.name; dl.appendChild(o);
      });
      const go = () => {
        const val = document.getElementById('picker-input').value.trim();
        const found = C.find(c => c.name.toLowerCase() === val.toLowerCase() ||
          c.abbr.toLowerCase() === val.toLowerCase());
        if (found) { location.href = 'find-help.html?con=' + found.abbr; }
        else { document.getElementById('picker-msg').textContent = 'Unknown constellation'; }
      };
      document.getElementById('picker-go').addEventListener('click', go);
      document.getElementById('picker-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') go();
      });
    } else {
      document.title = `Finding ${con.name} — Sky Trainer`;
      document.getElementById('page-sub').textContent = `Finding ${con.name}`;
      document.getElementById('screen-explore').classList.add('active');
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    // The guide source (js/guide-source.js) owns loading, caching, preparing and
    // validating. This page used to open-code all of it, with its two fetches outside
    // the ?v= fence — bug #83, and the reason spec #82 exists.
    initGuideSource({ fetch: (...a) => fetch(...a) });

    if (con) {
      // `origin` is this page's answer to "where is the learner looking?" — the question
      // every guide's opening `random` step asks. In the app it is the current view; here
      // there is no prior view, so a random patch of sky stands in. That difference is the
      // whole reason origin is a value the caller passes rather than something the module
      // reaches for.
      const origin = { ra: Math.random() * 360, dec: (Math.random() * 2 - 1) * 60 };

      // Two outcomes, deliberately distinct: null means no guide is written for this
      // constellation, a rejection means the load failed. This page has always shown two
      // different messages for them, which is why the module keeps them apart.
      prepareGuide(con, { origin })
        .then(guide => {
          if (!guide) {
            document.getElementById('fg-caption-label').textContent = con.name;
            document.getElementById('fg-caption-text').textContent = 'No finding guide is available for this constellation yet.';
            document.getElementById('fg-btn-next').disabled = true;
            document.getElementById('fg-btn-prev').disabled = true;
            return;
          }
          return skyCatalog().then(catalog => init(guide, catalog));
        })
        .catch(() => {
          document.getElementById('fg-caption-text').textContent = 'Could not load finding guide.';
        });
    }

    function init(guide, catalog) {
      initExploreGL(document.getElementById('explore-gl-canvas'));
      initExploreDrag();

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') document.getElementById('fg-btn-next').click();
        if (e.key === 'ArrowLeft') document.getElementById('fg-btn-prev').click();
      });

      document.getElementById('back-link').addEventListener('click', e => {
        e.preventDefault(); guideStop(); window.location.href = 'find-help.html';
      });

      guideStart(guide.steps, catalog, {
        roll: guide.roll,
        stepKey: `find-help-step-${con.abbr}`,
        onLastNext: () => { guideStop(); window.location.href = 'find-help.html'; },
      });
    }
  </script>
</body>

</html>
